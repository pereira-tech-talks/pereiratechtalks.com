name: "Óscar Andrés Granada Baquero"
role:
  en: "Software Architect at Slalom"
  es: "Arquitecto de Software en Slalom"
bio:
  en: "Software architect with nearly 19 years in the industry and a graduate of Universidad Tecnológica de Pereira. He has worked across industries and projects, and brings a broad view of software engineering — including the skills that matter most for tech now that LLMs are mainstream."
  es: "Arquitecto de software con casi 19 años de experiencia en la industria y egresado de la Universidad Tecnológica de Pereira. Ha acumulado experiencia en distintas industrias y proyectos, con una perspectiva amplia de la ingeniería de software —incluidas las habilidades que se han vuelto más relevantes en tech desde la masificación de los LLM."
