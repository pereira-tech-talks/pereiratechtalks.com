name: "Debbie Arredondo"
role:
  en: "Entrepreneur / Real-Time Operations Analyst at Celsia"
  es: "Emprendedor / Analista de Operaciones en Tiempo Real en Celsia"
bio:
  en: "Debbie is an electrical engineer with a master's degree in the same field, and has worked as a researcher, a professor, and today as a real-time operations analyst and entrepreneur. With deep knowledge of electronics, hardware, and software, Debbie has driven multiple projects in 3D printing, laser cutting, and embedded systems. That same curiosity fuels a long list of personal projects — projects that complexity used to slow down, at least until LLMs went mainstream. Today Debbie builds in days, and sometimes hours, ideas that once took months."
  es: "Debbie es un ingeniero eléctrico con maestría en esta misma área; se ha desempeñado como investigador, profesor y hoy en día como analista de operaciones en tiempo real y emprendedor. Posee amplios conocimientos en electrónica, hardware y software, y ha impulsado múltiples proyectos en impresión 3D, cortado láser y sistemas embebidos. Su curiosidad lo ha llevado a desarrollar proyectos personales donde la complejidad siempre los ralentizaba, o al menos hasta la masificación de los LLM. Hoy es capaz de construir en días —e incluso en horas— ideas que antes podían tomar meses."
