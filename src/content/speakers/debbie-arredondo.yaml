bio:
  en: "Electrical engineer with a master's degree; researcher, professor, and today a real-time operations analyst and entrepreneur. Works across electronics, hardware, and software — from 3D printing and laser cutting to embedded systems — and now ships in days (sometimes hours) ideas that once took months."
  es: "Ingeniero eléctrico con maestría; ha sido investigador, profesor y hoy analista de operaciones en tiempo real y emprendedor. Trabaja entre electrónica, hardware y software —impresión 3D, corte láser y sistemas embebidos— y hoy construye en días (a veces horas) ideas que antes tomaban meses."
