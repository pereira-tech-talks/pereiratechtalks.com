bio:
  en: "Juan José Cardona created the Official Vuetify UI Kit for Figma and CRUDDALS. A full-stack software developer who, out of curiosity, ended up building the kit and connecting with the Vuetify project. He spoke at the 2026 Pereira Tech Talks opening meetup on the Vuetify ecosystem and why it matters."
