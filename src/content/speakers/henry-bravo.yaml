bio:
  en: "Henry Bravo is the CEO of Seika AI. He argues that 90% of AI projects never reach production not because of technical capability but because teams confuse AI with a tool when it is, in fact, infrastructure — a perspective he unpacked at the May 2026 Pereira Tech Talks meetup."
  es: "Henry Bravo es CEO de Seika AI. Defiende que el 90% de los proyectos de IA no llegan a producción no por falta de capacidad técnica sino porque los equipos tratan a la IA como herramienta cuando en realidad es infraestructura — un argumento que desarrolló en el meetup de mayo de 2026 de Pereira Tech Talks."
