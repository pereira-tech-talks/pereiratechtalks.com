bio:
  en: "Mayra Valentina Velásquez is a self-taught web developer and designer focused on low-code solutions and digital product creation. Currently training as a professional coach, she speaks about the inner growth of women in technology — the invisible code of mindsets, beliefs, and learning that shape the path."
  es: "Mayra Valentina Velásquez es desarrolladora y diseñadora web autodidacta enfocada en soluciones low-code y creación de productos digitales. Actualmente en formación como coach profesional, habla del crecimiento interno de las mujeres en tecnología: el código invisible de mentalidades, creencias y aprendizajes que dan forma al camino."
