bio:
  en: "David Ricardo Rivera Arbeláez is a PhD candidate in engineering and the director of the Software Development program at Universidad Católica de Pereira. His doctoral thesis explores how autonomous AI agents can optimize energy consumption on IoT devices running at the edge."
  es: "David Ricardo Rivera Arbeláez es candidato a doctor en ingeniería y director del programa de Tecnología en Desarrollo de Software de la Universidad Católica de Pereira. Su tesis doctoral explora cómo agentes de IA autónomos pueden optimizar el consumo energético de dispositivos IoT que operan en el borde."
