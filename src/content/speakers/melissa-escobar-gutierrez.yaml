bio:
  en: "Melissa Escobar Gutiérrez is a systems and computing engineer working as a Ruby developer at Globant. She co-founded GDG Pereira and co-organizes Pereira Tech Talks and JointDeveloper, weaving together the Pereira tech ecosystem and connecting code with creativity through talks like 'The Art of Code'."
  es: "Melissa Escobar Gutiérrez es ingeniera de sistemas y computación y trabaja como Ruby developer en Globant. Co-fundó GDG Pereira y co-organiza Pereira Tech Talks y JointDeveloper, tejiendo el ecosistema tech de Pereira y conectando el código con la creatividad en charlas como 'The Art of Code'."
