description:
  en: "Pereira Tech Day did not host a flagship 2025 edition. After the 2024 edition closed, the organizing team chose to put the community's energy into strengthening the monthly meetup cadence, the Speaker School, and the bilingual catalog. The next flagship Pereira Tech Day is planned for 2026."
