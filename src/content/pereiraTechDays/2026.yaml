faqs:
  - question:
      en: How can I register?
      es: ¿Cómo puedo registrarme?
    answer:
      en: Registration is open on Luma. Capacity is limited (around 200 seats), so reserve your spot as soon as you can.
      es: Las inscripciones están abiertas en Luma. Solo tenemos alrededor de 200 cupos, así que reserva tu lugar cuanto antes.
    linkUrl: "https://luma.com/6lo3vt4x"
    linkLabel:
      en: Register on Luma
      es: Inscribirse en Luma
    whilePostponed:
      answer:
        en: >-
          Registration is closed for now. The event is postponed indefinitely,
          so there is nothing to sign up for yet. When we have a new date we
          will reopen registration and announce it on our channels.
        es: >-
          Las inscripciones están cerradas por ahora. El evento está pospuesto
          indefinidamente, así que todavía no hay nada a lo que registrarse.
          Cuando tengamos nueva fecha reabriremos las inscripciones y lo
          anunciaremos por nuestros canales.
  - question:
      en: Is the event free?
      es: ¿El evento es gratuito?
    answer:
      en: Yes, Pereira Tech Day is completely free.
      es: Sí, el evento es totalmente gratuito.
  - question:
      en: How many days does the event last?
      es: ¿Cuántos días dura el evento?
    answer:
      en: One day — Saturday, August 22, 2026.
      es: El evento es un solo día, el sábado 22 de agosto de 2026.
    whilePostponed:
      answer:
        en: >-
          It was planned as a single day, Saturday, August 22, 2026. That date
          is no longer valid: the event is postponed indefinitely and we have
          not set a new one yet.
        es: >-
          Estaba planeado como un solo día, el sábado 22 de agosto de 2026. Esa
          fecha ya no aplica: el evento está pospuesto indefinidamente y aún no
          tenemos una nueva.
  - question:
      en: Can I attend if I am not from UTP?
      es: ¿Si no soy de la UTP puedo asistir?
    answer:
      en: Yes. Pereira Tech Day is open to anyone interested in technology and learning.
      es: Sí puedes asistir; este es un evento abierto a todo público interesado en aprender más sobre estos temas.
  - question:
      en: How can my organization become a sponsor?
      es: ¿Cómo puede mi organización convertirse en patrocinador del evento?
    answer:
      en: Email pereiratechtalks@gmail.com with your interest. Sponsorship plans are on this page, and we are open to new proposals.
      es: Escríbenos a pereiratechtalks@gmail.com indicando que estás interesado en patrocinarnos. Los planes están en la sección Planes de esta página, pero estamos abiertos a nuevas propuestas.
    whilePostponed:
      answer:
        en: >-
          While the event is postponed we are not running sponsorship sales. If
          you would like to support the community anyway, write to
          pereiratechtalks@gmail.com — we will get back to you.
        es: >-
          Mientras el evento esté pospuesto no estamos gestionando patrocinios.
          Si de todas formas quieres apoyar a la comunidad, escríbenos a
          pereiratechtalks@gmail.com y te respondemos.
  - question:
      en: What topics will Pereira Tech Day cover?
      es: ¿Qué temas se hablarán en el Pereira Tech Day?
    answer:
      en: We will have a full day of software development, data science, machine learning, infrastructure, and more.
      es: Tendremos un día de desarrollo de software, data science, machine learning, infraestructura y más.
  - question:
      en: Will food be provided?
      es: ¿El evento cuenta con alimentación garantizada?
    answer:
      en: Thanks to the organizing team and our sponsors, we plan morning and afternoon refreshments plus coffee throughout the day.
      es: Gracias a la gestión del equipo organizador y a patrocinadores, contaremos con refrigerios en la mañana y en la tarde, además de una estación de café durante todo el día.
  - question:
      en: Can I attend only part of the day without registering?
      es: ¿Solo quiero/puedo asistir durante unas horas sin registrarse?
    answer:
      en: No. Seats are limited and we expect attendees who can stay for the full program.
      es: No, contamos con cupos limitados y esperamos que los ocupen personas que puedan asistir durante toda la jornada.
  - question:
      en: Will I receive a certificate of attendance?
      es: ¿Recibiré un certificado de asistencia?
    answer:
      en: >-
        Yes. After the event you receive a personal diploma link you can open,
        print or save as PDF, and share. You can also verify it online.
      es: >-
        Sí. Después del evento recibes un enlace personal al diploma que puedes abrir,
        imprimir o guardar como PDF, y compartir. También puedes verificarlo en línea.
    linkUrl: /pereira-tech-days/2026/certificates/ptd26_demo_a7k3m9qx
    linkLabel:
      en: View a demo certificate
      es: Ver un certificado de demostración
  - question:
      en: Do I need to bring a laptop?
      es: ¿Necesito llevar mi computador?
    answer:
      en: It is not required, but you may bring one for notes.
      es: No es necesario, aunque si quieres tomar apuntes lo puedes traer.
  - question:
      en: Is the venue safe?
      es: ¿El sitio es seguro?
    answer:
      en: Yes, but keep an eye on personal belongings — organizers are not responsible for lost items.
      es: Sí, pero debes estar pendiente de tus objetos personales; los organizadores no se hacen responsables por pérdidas o hurtos durante el evento.
  - question:
      en: Code of Conduct
      es: Código de Conducta
    answer:
      en: To foster a welcoming environment, Pereira Tech Day follows the Pereira Tech Talks Code of Conduct.
      es: Con el fin de crear un ambiente sensible y abierto para todos, la organización de Pereira Tech Day está comprometida con el Código de Conducta de Pereira Tech Talks.
    linkUrl: "/conduct"
    linkLabel:
      en: Read the Code of Conduct
      es: Leer el Código de Conducta
