year: 2026
title:
  en: Pereira Tech Day 2026
  es: Pereira Tech Day 2026
tagline:
  en: Where talent, technology, and brands meet.
  es: Donde el talento, la tecnología y las marcas se encuentran.
description:
  en: |-
    Pereira Tech Day is an event jointly organized by the PereiraJS, Python Pereira, Pereira Tech Talks, and Joint Developer communities. We join forces to create a diverse, enriching event, with talks covering many different facets of technology.

    At Pereira Tech Day, our goal is to share topics related to the tech world with the community, focused on inspiring and motivating people. This year's talks will not only cover technology topics, but also career paths, community building, and motivation — encouraging attendees to keep exploring, researching, and diving into the wonderful world of technology.
  es: |-
    Pereira Tech Day es un evento organizado en conjunto por las comunidades de PereiraJS, Python Pereira, Pereira Tech Talks y Joint Developer. Unimos fuerzas para crear un evento diverso y enriquecedor, con charlas que abarcan diferentes aspectos de la tecnología.

    En Pereira Tech Day, nuestro objetivo es compartir con la comunidad temas relacionados al mundo tecnológico, enfocados en inspirar y motivar a las personas. Las charlas de este año no solo cubrirán temas tecnológicos, sino también trayectorias profesionales, desarrollo comunitario y motivación, buscando incentivar a los asistentes a seguir explorando, investigando y adentrándose en el maravilloso mundo de la tecnología.
