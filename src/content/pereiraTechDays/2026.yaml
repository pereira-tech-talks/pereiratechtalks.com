    type: closing
    title:
      en: Raffles and closing
      es: Sorteos y cierre
    description:
      en: Sponsor raffles, thank-yous, and the group photo that closes the day.
      es: Sorteos de los patrocinadores, agradecimientos y la foto grupal que cierra la jornada.
