scheduleTentative: true
schedule:
  - time: "07:30"
    endTime: "08:00"
    type: registration
    title:
      en: Pre-registration
      es: Pre-registro
    description:
      en: Check in, pick up your badge, and grab a coffee before we start.
      es: Registra tu llegada, recoge tu escarapela y toma un café antes de comenzar.
  - time: "08:00"
    endTime: "08:30"
    type: opening
    title:
      en: Event kickoff
      es: Inicio del evento
    description:
      en: Welcome from the organizing communities and how the day will run.
      es: Bienvenida de las comunidades organizadoras y cómo será la jornada.
  - time: "08:30"
    endTime: "09:10"
    type: talk
    speaker: oscar-granada
    title:
      en: "Skills for the tech industry in the AI era"
      es: "Habilidades para industria tech en la era de la IA"
    description:
      en: >-
        Many people think coding is the only skill that matters — and that AI will
        replace programmers because of it. That is not true: there is much more to
        the craft. This talk outlines the skill set a web solutions architect needs
        in the age of AI.
      es: >-
        Muchos piensan que codificar es la única habilidad necesaria y por esto la IA
        va a reemplazar a los programadores, pero esto no es verdad: hay mucho más.
        Esta charla acota el set de habilidades necesarias para un arquitecto de
        soluciones web en la era de la IA.
  - time: "09:15"
    endTime: "09:55"
    type: talk
    speaker: debbie-arredondo
    title:
      en: "Complex projects in a couple of hours — building complex things has never been this accessible"
      es: "Proyectos complejos en un par de horas — construir lo complejo nunca fue tan accesible"
    description:
      en: >-
        Turning an idea into a project has always been slow and expensive, and that
        barrier made us think twice before starting something new. With emerging
        technologies, costs that used to be steep — like acquiring specific, hidden
        knowledge — have flattened out. This talk shows how Debbie built projects
        before, how they get built now, and how the cost of work such as research
        has dropped to a level that opens the door to entirely new possibilities.
      es: >-
        Convertir una idea en un proyecto siempre ha sido un proceso lento y costoso,
        y esa barrera hacía que pensáramos dos veces si valía la pena empezar una
        nueva idea. Con las tecnologías emergentes, costos antaño tan altos como
        obtener conocimiento específico y oculto se han aplanado. Esta charla muestra
        cómo Debbie ha desarrollado proyectos en el pasado, cómo lo hace ahora, y cómo
        el costo de tareas como la investigación ha bajado a niveles que abren la
        puerta a nuevas posibilidades.
  - time: "10:00"
    endTime: "10:40"
    type: talk
  - time: "10:45"
    endTime: "10:50"
    type: sponsor-break
    title:
      en: Sponsor break
      es: Sponsor break
  - time: "10:50"
    endTime: "11:20"
    type: break
    title:
      en: Break and networking
      es: Descanso y networking
    description:
      en: Refreshments, coffee station, and time to meet the rest of the community.
      es: Refrigerio, estación de café y tiempo para conocer al resto de la comunidad.
  - time: "11:25"
    endTime: "12:05"
    type: talk
    speaker: eliana-osorio
    title:
      en: "Nobody arrives in tech empty-handed"
      es: "Nadie llega a la tecnología con las manos vacías"
    description:
      en: >-
        Do you think entering tech means starting from zero? The reality is different.
        Every profession leaves skills, experiences, and ways of solving problems that
        also belong in technology. This talk shows how to spot those transferable skills
        and turn prior experience into an advantage — whether you come from administration,
        psychology, design, education, accounting, beauty, or any other field. Through real
        stories and practical tools, we explore why tech needs more than people who can
        code: it needs different perspectives, collaboration, communication, leadership,
        and constant learning. Changing careers is not starting from zero — it is
        discovering the value of everything you already bring.
      es: >-
        ¿Crees que para entrar a la industria tecnológica debes empezar desde cero? La
        realidad es otra. Cada profesión deja habilidades, experiencias y formas de
        resolver problemas que también tienen un lugar en el mundo de la tecnología. En
        esta charla descubrirás cómo identificar esas habilidades transferibles y convertir
        tu experiencia previa en una ventaja para construir una carrera en esta industria,
        sin importar si vienes de administración, psicología, diseño, educación, contabilidad,
        belleza o cualquier otra profesión. A través de historias reales y herramientas
        prácticas, exploraremos por qué la tecnología necesita mucho más que personas que
        sepan programar: necesita perspectivas diferentes, capaces de colaborar, comunicar,
        liderar y aprender constantemente. Porque cambiar de carrera no significa empezar
        de cero: significa descubrir el valor de todo lo que ya traes contigo.
  - time: "12:10"
    endTime: "12:50"
    type: talk
  - time: "12:55"
    endTime: "13:00"
    type: sponsor-break
    title:
      en: "Sponsor break #2"
      es: "Sponsor break #2"
  - time: "13:00"
    endTime: "13:30"
    type: lightning
    title:
      en: Lightning talks
      es: Charlas relámpago
    description:
      en: Short, high-energy talks from our sponsors and the community.
      es: Charlas cortas y de alta energía de nuestros patrocinadores y la comunidad.
  - time: "13:35"
