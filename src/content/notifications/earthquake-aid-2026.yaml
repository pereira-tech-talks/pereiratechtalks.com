severity: important
title:
  en: Pereira Tech Day postponed
  es: Pereira Tech Day pospuesto
summary:
  en: "Indefinitely postponed after the August 10 earthquake. Help neighbors via Conectando Ayudas."
  es: "Pospuesto indefinidamente tras el terremoto del 10 de agosto. Ayuda a vecinos en Conectando Ayudas."
body:
  en: |-
    Pereira Tech Day 2026 is postponed indefinitely. Our community stands with everyone affected in Pereira, Risaralda, and western Colombia.

    The priority now is mutual aid. Conectando Ayudas is a live open-source app where you can request help, offer help, or contribute to improving the tool together.
  es: |-
    Pereira Tech Day 2026 queda pospuesto indefinidamente. Nuestra comunidad está con todas las personas afectadas en Pereira, Risaralda y el occidente colombiano.

    La prioridad ahora es la ayuda mutua. Conectando Ayudas es una app open source en vivo donde puedes pedir ayuda, ofrecer ayuda o contribuir a mejorar la herramienta entre todos.
