severity: important
title:
  en: Pereira Tech Day postponed
  es: Pereira Tech Day pospuesto
summary:
  en: "Indefinitely postponed after the August 10 earthquake. Help neighbors via Corag and Ayudas Pereira."
  es: "Pospuesto indefinidamente tras el terremoto del 10 de agosto. Ayuda a vecinos en Corag y Ayudas Pereira."
body:
  en: |-
    Pereira Tech Day 2026 is postponed indefinitely. Our community stands with everyone affected in Pereira, Risaralda, and western Colombia.

    The priority now is mutual aid. Local initiatives already coordinating help include Corag Ayuda directa and Ayudas Pereira.

    Read the full announcement on our blog: /en/blog/ptd-2026-postponed-earthquake-solidarity/
  es: |-
    Pereira Tech Day 2026 queda pospuesto indefinidamente. Nuestra comunidad está con todas las personas afectadas en Pereira, Risaralda y el occidente colombiano.

    La prioridad ahora es la ayuda mutua. Iniciativas locales que ya coordinan ayuda: Corag Ayuda directa y Ayudas Pereira.

    Lee el anuncio completo en el blog: /blog/ptd-2026-postponed-earthquake-solidarity/
