# Sitewide notice: the call for speakers is open on the programmed meetups.
#
# Took over the bar from `ptd-2026-postponed.yaml` on 2026-08-27. The bar is a
# scarce, sitewide slot and only one notification shows at a time, so whatever
# sits here should be the thing the community can most act on today.
#
# `endsAt` is the last deadline in the cycle (December's call closes 11 Dec), so
# the notice retires itself rather than outliving the calls it advertises. When
# the next cycle is programmed, extend it or seed a new entry — do NOT leave a
# bar up that points at closed calls.
#
# Priority 200 keeps it above `monthly-meetups.yaml` (50).
# `important` drives BOTH the teal bar (#1f6f73 with white text) and the
# IMPORTANTE / IMPORTANT badge — see severityClass() in TopNotificationBar.svelte.
# `info` renders a plain elevated-surface bar with no badge.
severity: important
title:
  en: We are looking for speakers
  es: Estamos buscando ponentes
summary:
  en: "Every month until December. Lightning talk or full talk — you pick."
  es: "Todos los meses hasta diciembre. Charla relámpago o charla larga: tú eliges."
# One line only. The image above it already carries the format, the duration,
# the period and that it is online — repeating that here made the modal read
# like a form. What the image cannot say is the invitation.
body:
  en: "If you have never presented, this is your moment. See you there!"
  es: "Si nunca has presentado, este es tu momento. ¡Te esperamos!"
# Two pieces, one per language — the headline is translated, so `src` takes the
# `{ en, es }` form. Regenerated 2026-08-28 when October–December opened to
# full talks: the flyer no longer says "3 a 5 minutos" and no longer claims
# Virtual, because the mode of those three months is undecided. Prompt in
# tmp/flyer-04-call-for-speakers-modal.md.
image:
  src:
    en: /images/call-for-speakers/2026.en.webp
    es: /images/call-for-speakers/2026.webp
  alt:
    en: >-
      Pereira Tech Talks call for speakers: 5 or 25 minutes, lightning or full
      talks, every month from September to December 2026. Your first talk starts
      here.
    es: >-
      Convocatoria de ponentes de Pereira Tech Talks: 5 o 25 minutos, charlas
      relámpago o completas, todos los meses de septiembre a diciembre de 2026.
      Tu primera charla cabe aquí.
# One link per month, so a reader can go straight to the meetup they want
# rather than landing on the index and hunting. Authored here rather than
# derived from the open calls: the notification system stays decoupled from the
# meetups collection, and this list is short and reviewed by a human anyway.

ctas:
  - label: { en: September, es: Septiembre }
    href: /meetups/september-meetup-2026/#call-for-speakers
  - label: { en: October, es: Octubre }
    href: /meetups/october-meetup-2026/#call-for-speakers
  - label: { en: November, es: Noviembre }
    href: /meetups/november-meetup-2026/#call-for-speakers
  - label: { en: December, es: Diciembre }
    href: /meetups/december-meetup-2026/#call-for-speakers
# No primary CTA on purpose: the four month links below ARE the action, and a
# generic "Propón tu charla" button competed with them. `ctaHref` stays out
# entirely — the bar only falls back to it when `modalEnabled` is false.
modalEnabled: true
startsAt: 2026-08-27T00:00:00.000Z
endsAt: 2026-12-11T23:59:59.000Z
priority: 200
active: true
