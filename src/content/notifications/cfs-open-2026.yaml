# Sitewide notice: the call for speakers is open on the programmed meetups.
#
# Took over the bar from `ptd-2026-postponed.yaml` on 2026-08-27. The bar is a
# scarce, sitewide slot and only one notification shows at a time, so whatever
# sits here should be the thing the community can most act on today.
#
# `endsAt` is the last deadline in the cycle (December's call closes 11 Dec), so
# the notice retires itself rather than outliving the calls it advertises. When
# the next cycle is programmed, extend it or seed a new entry — do NOT leave a
# bar up that points at closed calls.
#
# Priority 200 keeps it above `monthly-meetups.yaml` (50).
# `important` drives BOTH the teal bar (#1f6f73 with white text) and the
# IMPORTANTE / IMPORTANT badge — see severityClass() in TopNotificationBar.svelte.
# `info` renders a plain elevated-surface bar with no badge.
severity: important
title:
  en: We are looking for speakers
  es: Estamos buscando ponentes
summary:
  en: "Lightning talks, every month until December. Propose yours in 3–5 minutes."
  es: "Charlas relámpago, todos los meses hasta diciembre. Propón la tuya en 3–5 minutos."
body:
  en: |-
    Every monthly meetup from September to December 2026 is a lightning talk night, and the call for speakers is open on all of them.

    Three to five minutes, one idea per talk, online. You do not need a finished deck to propose — send us the link to where it will be published and we will help you shape the narrative.

    First-time speakers are exactly who we built this format for.
  es: |-
    Cada meetup mensual de septiembre a diciembre de 2026 es una noche de charlas relámpago, y la convocatoria está abierta en todos.

    De tres a cinco minutos, una idea por charla, virtual. No necesitas tener las diapositivas terminadas para postular — mándanos el enlace a donde se van a publicar y te ayudamos a armar la narrativa.

    Si nunca has presentado, este es justo el formato que hicimos para eso.
