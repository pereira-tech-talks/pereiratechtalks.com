name: Code Check

on:
  pull_request:
    branches:
      - 'main'
      - 'v3'
      - 'dev'
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code_check:
    name: 'Code Check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Step 0 - ⚙️ Enable Corepack (pnpm on PATH for Playwright webServer)
        run: corepack enable
      - name: Step 0b - 📁 Get pnpm store path
        id: pnpm-store
        run: |
          STORE_PATH=$(pnpm store path --silent)
          echo "STORE_PATH=${STORE_PATH}" >> "$GITHUB_OUTPUT"
      - name: Step 0c - 📁 Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Step 1 - ⚙️ Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Step 2 - 🧪 Run astro checks
        run: pnpm run astro:check
      - name: Step 3 - 🧪🧪 Run biome checks
        run: pnpm run biome:check
      - name: Step 4 - 🧪🧪🧪 Run tests
        run: pnpm run test
      - name: Step 5 - 🏗️ Build site
        run: pnpm run build
      - name: Step 6 - 📏 Check search performance budgets
        run: pnpm run search:budgets
      - name: Step 7 - 🤖 Check agent-markdown completeness and language
        run: pnpm run md:check:strict
      - name: Step 8 - 🌐 Audit sitewide language integrity
        run: pnpm run lang:check:strict
      - name: Step 9 - 🔍 Audit per-URL SEO and structured data
        run: pnpm run seo:check:strict
      - name: Step 10 - ⚖️ Audit bilingual content parity
        run: pnpm run parity:check:strict
      - name: Step 11 - 🖥️ Install Playwright Chromium for responsive suite
        run: pnpm exec playwright install --with-deps chromium
      - name: Step 12 - 📱 Run responsive regression suite
        run: pnpm run test:responsive
      - name: Step 13 - 🔦 Run Lighthouse audit
        run: pnpm run lighthouse
