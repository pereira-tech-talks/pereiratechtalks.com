name: pertechtalkslocal

services:
  pertechtalksvscode:
    container_name: pertechtalks
    init: true
    build:
      context: .
      dockerfile: ./pertechtalks/Dockerfile
    working_dir: /app
    volumes:
      - ../..:/app
      # Persistent data volumes for the node user (the only user that runs the AI CLIs)
      - claude_data:/home/node/.claude_data
      - codex_data:/home/node/.codex_data
      - cursor_data:/home/node/.cursor_data
      - gh_data:/home/node/.gh_data
      - dailybot_data:/home/node/.dailybot_data
      - chelper_data:/home/node/.chelper_data
      - opencode_data:/home/node/.opencode_data
      - pi_data:/home/node/.pi_data
      - cline_data:/home/node/.cline_data
      - herdr_data:/home/node/.herdr_data
      - grok_data:/home/node/.grok_data
      # sshd host keys — keeping them out of the image means the container's SSH
      # identity survives a rebuild and clients never see a host-key mismatch.
      - sshd_data:/etc/ssh/sshd_keys
      # pnpm store + registry metadata cache. These MUST stay off the /app bind
      # mount: Docker Desktop's `fakeowner` layer cannot service the store's
      # hardlinks and installs fail with ERR_PNPM_EPERM. Named volumes are real
      # ext4, and keeping them named means a rebuild does not re-download every
      # package. The path is pinned in entrypoint.sh (setup_nodejs).
      - pnpm_store:/home/node/.local/share/pnpm/store
      - pnpm_cache:/home/node/.cache/pnpm
      - ${HOME}/.ssh:/home/node/.ssh_host:ro
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro
    ports:
      # Use 8888 on host to avoid conflict with macOS AirPlay Receiver (port 8888)
      - '8888:8888'
      # SSH into the dev container: `ssh -p 22030 node@<docker-host>`. Both
      # sides are pinned to 22030; if you change it, change SSH_SERVER_PORT in
      # pertechtalks/.env to match (entrypoint.sh reads it). Published on every
      # interface so a phone on the LAN can reach it — use
      # '127.0.0.1:22030:22030' to keep it on this machine only.
      - '22030:22030'
    env_file:
      - pertechtalks/.env
    environment:
      - DOCKER_DEV_ENV=vscode
    command:
      - /bin/sh
      - -c
      - |
        sleep infinity

volumes:
  claude_data: {}        # Claude CLI session/auth (symlinked to ~/.claude)
  codex_data: {}         # Codex CLI session/auth (symlinked to ~/.codex)
  cursor_data: {}        # Cursor CLI session/auth (symlinked to ~/.cursor)
  gh_data: {}            # GitHub CLI session/auth (symlinked to ~/.config/gh)
  dailybot_data: {}      # Dailybot CLI session/auth (symlinked to ~/.config/dailybot)
  chelper_data: {}       # Z.AI Coding Tool Helper config (symlinked to ~/.chelper)
  opencode_data: {}      # OpenCode config + share (symlinked to ~/.config/opencode, ~/.local/share/opencode)
  pi_data: {}            # Pi sessions/config (symlinked to ~/.pi)
  cline_data: {}         # Cline sessions/config (symlinked to ~/.cline)
  herdr_data: {}         # Herdr config/logs (symlinked to ~/.config/herdr)
  grok_data: {}          # Grok CLI sessions/config (symlinked to ~/.grok)
  sshd_data: {}          # sshd host keys — stable container identity across rebuilds
  pnpm_store: {}         # pnpm content-addressable store — never on the bind mount
  pnpm_cache: {}         # pnpm registry metadata cache
