# devcontainer-kit sshd drop-in. Public-key only, no root, no passwords.
# The host publishes the port on 127.0.0.1 only (dck.toml `ssh_port`).
# Host keys and AllowUsers are written at runtime by the entrypoint (dck_sshd).
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
PermitEmptyPasswords no
PermitUserEnvironment no
# Agent forwarding from the host is how the container uses the developer's
# keys: they are never copied in. Herdr needs local stream/TCP forwarding.
AllowAgentForwarding yes
AllowTcpForwarding local
AllowStreamLocalForwarding local
GatewayPorts no
PermitTunnel no
X11Forwarding no
UsePAM yes
